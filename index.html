<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Rubensdj/cartorio-virtual-suporte/main/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Cartório Virtual — Cartão de Relacionamento</title>
<style>
/* ===== PRISMATIC TOKENS ===== */
:root {
  --bg: #050505;
  --bg-gradient: linear-gradient(180deg, #050505 0%, #0a0a0a 50%, #050505 100%);
  --surface: rgba(255,255,255,0.03);
  --surface-hover: rgba(255,255,255,0.08);
  --surface-border: rgba(255,255,255,0.08);
  --accent-primary: #ff2e63;
  --accent-secondary: #ffd800;
  --accent-gradient: linear-gradient(135deg, #ff2e63, #ffd800);
  --text-primary: #ffffff;
  --text-secondary: #a0a0a0;
  --text-tertiary: #666;
  --shadow-1: 0 4px 16px rgba(0,0,0,0.2);
  --shadow-2: 0 12px 32px rgba(0,0,0,0.3);
  --shadow-3: 0 20px 60px rgba(0,0,0,0.4);
  --shadow-accent: 0 8px 32px rgba(255,46,99,0.25);
  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --transition-fast: all 0.15s cubic-bezier(0.4,0,0.2,1);
  --transition-normal: all 0.25s cubic-bezier(0.4,0,0.2,1);
  --transition-slow: all 0.4s cubic-bezier(0.4,0,0.2,1);
  --transition-bouncy: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  overflow-x: hidden;
  touch-action: manipulation;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  background: var(--bg-gradient);
}

.app-frame {
  max-width: 440px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  padding-bottom: 72px;
  border-left: 1px solid var(--surface-border);
  border-right: 1px solid var(--surface-border);
  background: radial-gradient(circle at top, rgba(255,46,99,0.03) 0%, transparent 50%);
}

.status-bar {
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--text-secondary);
}

.status-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-primary);
  box-shadow: 0 0 10px rgba(255,46,99,0.5);
  animation: pulse-dot 2s infinite;
}

@keyframes pulse-dot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,46,99,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(255,46,99,0); }
}

.app-header {
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: rgba(5,5,5,0.8);
  backdrop-filter: blur(30px);
  border-bottom: 1px solid var(--surface-border);
  z-index: 20;
}

.app-header .logo {
  display: flex;
  align-items: center;
  gap: 8px;
}

.app-header .logo-dot {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--accent-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  box-shadow: var(--shadow-accent);
}

.app-header .logo-text {
  font-size: 18px;
  font-weight: 700;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.app-header .avatar {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition-bouncy);
  position: relative;
  overflow: hidden;
}

.app-header .avatar::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  background-size: 200% 200%;
  animation: shimmer 3s infinite;
  z-index: -1;
}

.app-header .avatar:hover {
  transform: scale(1.1) rotate(5deg);
  box-shadow: 0 0 25px rgba(255,46,99,0.4);
}

@keyframes shimmer {
  0%, 100% { background-position: 0 0; }
  50% { background-position: 100% 100%; }
}

.hero {
  padding: 24px 20px;
  text-align: center;
}

.hero-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 20px;
  border-radius: 24px;
  background: var(--accent-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  box-shadow: 
    0 20px 60px rgba(255,46,99,0.3),
    0 0 0 8px rgba(255,255,255,0.1);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.hero h1 {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 6px;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero p {
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 20px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 16px;
  font-family: inherit;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: var(--transition-slow);
  padding: 14px 24px;
  width: 100%;
}

.btn-primary {
  background: var(--accent-gradient);
  color: white;
  box-shadow: var(--shadow-accent);
  border: none;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(255,46,99,0.3);
}

.btn-secondary {
  background: var(--surface);
  color: var(--text-primary);
  border: 1px solid var(--surface-border);
}

.btn-secondary:hover {
  background: var(--surface-hover);
  border-color: var(--accent-primary);
}

.btn-ghost {
  background: transparent;
  color: var(--accent-primary);
  border: 1px solid var(--accent-primary);
}

.btn-ghost:hover {
  background: var(--accent-primary);
  color: var(--bg);
}

/* ===== CARTÃO DE RELACIONAMENTO (Student Card Style) ===== */
.cartao-container {
  padding: 24px 20px;
}

.cartao-wrapper {
  position: relative;
  max-width: 340px;
  margin: 0 auto;
}

.cartao-relacionamento {
  background: linear-gradient(135deg, #1a1a1a 0%, #222222 100%);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 
    0 20px 60px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  min-height: 480px;
  display: flex;
  flex-direction: column;
  position: relative;
}

.cartao-relacionamento::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 6px;
  background: var(--accent-gradient);
}

.cartao-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px 12px;
}

.cartao-logo {
  display: flex;
  align-items: center;
  gap: 8px;
}

.cartao-logo .logo-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: var(--accent-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.cartao-logo-text {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
}

.cartao-level {
  font-size: 11px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.level-namoro { background: rgba(255,107,159,0.15); color: #ff6b9d; border: 1px solid rgba(255,107,159,0.3); }
.level-noivado { background: rgba(255,215,0,0.15); color: #ffd700; border: 1px solid rgba(255,215,0,0.3); }
.level-casamento { background: rgba(221,160,221,0.15); color: #dda0dd; border: 1px solid rgba(221,160,221,0.3); }
.level-uniao { background: rgba(144,238,144,0.15); color: #90ee90; border: 1px solid rgba(144,238,144,0.3); }

.cartao-body {
  flex: 1;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 20px;
}

.cartao-names {
  text-align: center;
}

.cartao-names .nome-principal {
  font-size: 26px;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.cartao-names .nome-parceiro {
  font-size: 20px;
  font-weight: 600;
  color: var(--text-secondary);
}

.cartao-coracao {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 18px;
  color: var(--accent-primary);
  margin: 12px 0;
  animation: heartbeat 1.5s ease infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); opacity: 0.8; }
  50% { transform: scale(1.2); opacity: 1; }
}

.cartao-data {
  text-align: center;
  font-size: 13px;
  color: var(--text-secondary);
}

.cartao-qr {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 16px 0;
}

.cartao-qr .qr-code {
  width: 70px;
  height: 70px;
  background: #fff;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

.cartao-qr .qr-code::after {
  content: 'QR';
  font-size: 14px;
  font-weight: 700;
  color: #333;
}

.cartao-qr .qr-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.cartao-qr .qr-info .qr-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
}

.cartao-qr .qr-info .qr-desc {
  font-size: 10px;
  color: var(--text-tertiary);
}

.cartao-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--surface-border);
  text-align: center;
}

.cartao-footer .motd {
  font-size: 12px;
  color: var(--text-secondary);
  font-style: italic;
}

.cartao-badges {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
}

.cartao-badge {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  border: 1px solid var(--surface-border);
}

/* ===== CONTROLS ===== */
.cartao-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.cartao-actions button {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 16px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: var(--transition-slow);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.action-preview {
  background: var(--surface);
  color: var(--text-primary);
  border: 1px solid var(--surface-border);
}

.action-preview:hover {
  background: var(--surface-hover);
  border-color: var(--accent-primary);
  transform: translateY(-2px);
}

.action-download {
  background: var(--accent-gradient);
  color: white;
  border: none;
}

.action-download:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-accent);
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  margin: 0 auto;
  max-width: 440px;
  background: rgba(10,10,10,0.7);
  backdrop-filter: blur(20px);
  border: 1px solid var(--surface-border);
  border-radius: 32px;
  padding: 8px;
  display: flex;
  justify-content: space-around;
  z-index: 30;
  box-shadow: 
    0 8px 32px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.06);
}

.bottom-nav button {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-tertiary);
  padding: 10px 4px;
  font-size: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: var(--transition-fast);
  border-radius: 16px;
}

.bottom-nav button.active,
.bottom-nav button:hover {
  color: var(--accent-primary);
  background: rgba(255,46,99,0.15);
}

.bottom-nav button.active .indicator,
.bottom-nav button:hover .indicator {
  opacity: 1;
  transform: scale(1);
}

.bottom-nav .nav-icon {
  font-size: 18px;
  margin-bottom: 2px;
}

.bottom-nav .indicator {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent-primary);
  opacity: 0;
  transform: scale(0);
  transition: var(--transition-fast);
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(16px);
  display: flex;
  align-items: flex-end;
  z-index: 100;
  padding: 0;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
  padding: 20px;
}

.modal-content {
  background: var(--bg);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 24px 20px 16px;
  width: 100%;
  max-width: 440px;
  animation: slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: var(--shadow-3);
}

@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-handle {
  width: 40px;
  height: 4px;
  background: var(--surface-border);
  border-radius: 2px;
  margin: 8px auto 20px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.modal-header h2 {
  font-size: 20px;
  font-weight: 700;
}

.modal-header .close-btn {
  width: 32px;
  height: 32px;
  border-radius: 12px;
  background: var(--surface);
  border: none;
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  transition: var(--transition-normal);
}

.modal-header .close-btn:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
  transform: rotate(90deg);
}

.form-grid {
  display: grid;
  gap: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.form-group label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 16px;
  font-family: inherit;
  transition: var(--transition-normal);
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--accent-primary);
  background: rgba(255,255,255,0.03);
  box-shadow: 0 0 0 3px rgba(255,46,99,0.1);
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 160px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15,15,15,0.9);
  border: 1px solid var(--surface-border);
  border-radius: 16px;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  backdrop-filter: blur(20px);
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.toast.show {
  opacity: 1;
  pointer-events: all;
}
</style>
</head>
<body>
<div class="app-frame">
  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-item">
      <span class="status-dot"></span>
      Online
    </div>
    <div class="status-item">Premium</div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="logo">
      <div class="logo-dot">💍</div>
      <span class="logo-text">Cartório Virtual</span>
    </div>
    <div class="avatar">RP</div>
  </header>

  <!-- Main Content -->
  <main id="main-content">
    <div class="cartao-container">
      <div class="cartao-wrapper">
        <!-- Sample card rendered by JS -->
      </div>
      
      <div class="cartao-actions">
        <button class="action-preview" onclick="showModal('creator')">
          ✏️ Editar
        </button>
        <button class="action-download" onclick="downloadPDF()">
          📄 Baixar PDF
        </button>
      </div>
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="active" onclick="switchTab('home')">
      <span class="nav-icon">🏠</span>
      <span>Início</span>
      <span class="indicator"></span>
    </button>
    <button onclick="switchTab('cards')">
      <span class="nav-icon">💳</span>
      <span>Cartões</span>
      <span class="indicator"></span>
    </button>
    <button onclick="switchTab('docs')">
      <span class="nav-icon">📄</span>
      <span>Documentos</span>
      <span class="indicator"></span>
    </button>
    <button onclick="switchTab('profile')">
      <span class="nav-icon">👤</span>
      <span>Perfil</span>
      <span class="indicator"></span>
    </button>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast">Cartão baixado com sucesso! 📄</div>

  <!-- Creator Modal -->
  <div id="creator-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2>Criar Novo Cartão</h2>
        <button class="close-btn" onclick="closeModal('creator-modal')">&times;</button>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Seu nome</label>
          <input type="text" id="nome1" placeholder="Digite seu nome" value="Você" />
        </div>
        <div class="form-group">
          <label>Nome do parceiro(a)</label>
          <input type="text" id="nome2" placeholder="Digite o nome do parceiro" value="Amor da minha vida" />
        </div>
        <div class="form-group">
          <label>Data de início</label>
          <input type="date" id="sinceDate" value="2023-06-15" />
        </div>
        <div class="form-group">
          <label>Nível de relacionamento</label>
          <select id="level">
            <option value="namoro">💘 Namorando</option>
            <option value="noivado" selected>💍 Noivado</option>
            <option value="casamento">👰 Casamento</option>
            <option value="uniao">🤝 União Estável</option>
          </select>
        </div>
        <div class="form-group">
          <label>Emoji do casal</label>
          <input type="text" id="emoji" placeholder="💑" value="💑" />
        </div>
        <div class="form-group">
          <label>Frase do cartão</label>
          <input type="text" id="motd" placeholder="Digite uma frase especial..." value="Juntos por decisão, unidos por escolha." />
        </div>
        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <button class="btn btn-secondary" style="flex:1" onclick="closeModal('creator-modal')">Cancelar</button>
          <button class="btn btn-primary" style="flex:1" onclick="createCard()">Criar Cartão</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== CARD DATA =====
let currentCard = {
  id: Date.now(),
  partner1: 'Você',
  partner2: 'Amor da minha vida',
  sinceDate: '2023-06-15',
  level: 'noivado',
  emoji: '💑',
  motd: 'Juntos por decisão, unidos por escolha.',
  badges: [
    { id: 1, icone: '💕' },
    { id: 2, icone: '🌹' },
    { id: 3, icone: '💍' }
  ]
};

const levelLabels = {
  namoro: 'Namorando',
  noivado: 'Noivado',
  casamento: 'Casados',
  uniao: 'União Estável'
};

const levelClasses = {
  namoro: 'level-namoro',
  noivado: 'level-noivado',
  casamento: 'level-casamento',
  uniao: 'level-uniao'
};

// ===== RENDER CARD =====
function renderCard(card) {
  const wrapper = document.querySelector('.cartao-wrapper');
  wrapper.innerHTML = `
    <div class="cartao-relacionamento">
      <div class="cartao-header">
        <div class="cartao-logo">
          <div class="logo-icon">${card.emoji}</div>
          <span class="cartao-logo-text">Cartão de Relacionamento</span>
        </div>
        <div class="cartao-level ${levelClasses[card.level]}">${levelLabels[card.level]}</div>
      </div>
      
      <div class="cartao-body">
        <div class="cartao-names">
          <div class="nome-principal">${card.partner1}</div>
          <div class="cartao-coracao">
            <span>💕</span>
            <span>💕</span>
            <span>💕</span>
          </div>
          <div class="nome-parceiro">${card.partner2}</div>
        </div>
        
        <div class="cartao-data">
          💘 Juntos desde: ${new Date(card.sinceDate).toLocaleDateString('pt-BR')}
        </div>
        
        <div class="cartao-qr">
          <div class="qr-code"></div>
          <div class="qr-info">
            <div class="qr-title">ID do Par</div>
            <div class="qr-desc">${card.id.toString().slice(-8)}</div>
          </div>
        </div>
      </div>
      
      <div class="cartao-footer">
        <div class="motd">${card.motd}</div>
        <div class="cartao-badges">
          ${card.badges.map(b => `<div class="cartao-badge">${b.icone}</div>`).join('')}
        </div>
      </div>
    </div>
  `;
}

// ===== MODAL FUNCTIONS =====
function showModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) {
    modal.style.display = 'block';
    setTimeout(() => modal.classList.add('active'), 10);
  }
}

function closeModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) {
    modal.classList.remove('active');
    setTimeout(() => modal.style.display = 'none', 300);
  }
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function createCard() {
  currentCard = {
    id: Date.now(),
    partner1: document.getElementById('nome1').value,
    partner2: document.getElementById('nome2').value,
    sinceDate: document.getElementById('sinceDate').value,
    level: document.getElementById('level').value,
    emoji: document.getElementById('emoji').value,
    motd: document.getElementById('motd').value,
    badges: currentCard.badges
  };
  
  renderCard(currentCard);
  closeModal('creator-modal');
  showToast('Cartão atualizado! 🎉');
}

function downloadPDF() {
  showToast('📄 PDF gerado! (Use a opção "Salvar como PDF" do navegador)');
  
  // In real implementation, use html2canvas + jsPDF
  // For now, just show success
  setTimeout(() => {
    window.print();
  }, 100);
}

function switchTab(tab) {
  const buttons = document.querySelectorAll('.bottom-nav button');
  buttons.forEach(b => {
    b.classList.toggle('active', b.querySelector('span:last-child').textContent.toLowerCase().includes(tab));
  });
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  renderCard(currentCard);
});

// Close modal when clicking outside
window.onclick = function(e) {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.style.display = 'none';
    e.target.classList.remove('active');
  }
};
</script>
</body>
